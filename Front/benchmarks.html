<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Benchmarks</title>
    <link rel="stylesheet" href="benchmarks.css">
</head>
<body>
    <header class="header">
        <div class="header-content">
            <div class="logo">
                <i class="fas fa-chart-bar"></i>
                <h1>Benchmarks</h1>
            </div>
            <div class="header-controls">
                <a href="index.html" class="btn-refresh"><i class="fas fa-arrow-left"></i> Volver</a>
            </div>
        </div>
    </header>
    <main class="main-content">
        <section style="text-align:center; margin-top:3rem;">
            <div style="margin-top:2rem;">
                <h3>1. PIR vs MPU6050</h3>
                <table class="bench-table">
                    <thead>
                        <tr>
                            <th>Sensor</th>
                            <th>Cantidad de Activaciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>PIR</td>
                            <td id="pir-activaciones"></td>
                        </tr>
                        <tr>
                            <td>MPU6050</td>
                            <td id="mpu-activaciones"></td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div style="margin-top:2rem;">
                <h3>2. Alarma vs Email</h3>
                <table class="bench-table">
                    <thead>
                        <tr>
                            <th>Método</th>
                            <th>Velocidad de Notificación (ms)</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>Alarma</td>
                            <td id="alarma-velocidad"></td>
                        </tr>
                        <tr>
                            <td>Email</td>
                            <td id="email-velocidad"></td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div style="margin-top:2rem;">
                <h3>3. Login MFA vs Login sin MFA</h3>
                <table class="bench-table">
                    <thead>
                        <tr>
                            <th>Tipo de Login</th>
                            <th>Velocidad de Autenticación (ms)</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>Login MFA</td>
                            <td>
                                <span id="login-mfa-velocidad"></span>
                                <br>
                            </td>
                        </tr>
                        <tr>
                            <td>Login sin MFA</td>
                            <td>
                                <span id="login-simple-velocidad"></span>
                                <br>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>
    <script src="benchmarks.js"></script>
</body>
</html>
