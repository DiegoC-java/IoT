<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard IoT - Local</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

    <header class="header">
        <div class="header-content">
            <div class="logo">
                <i class="fas fa-chart-line"></i>
                <h1>Dashboard IoT</h1>
            </div>
            <div class="header-controls">
                <button id="refreshBtn" class="btn-refresh">
                    <i class="fas fa-sync-alt"></i>
                    Actualizar
                </button>
            </div>
        </div>
    </header>

    <aside class="sidebar">
        <nav class="nav-menu">
            <ul>
                <li class="nav-item active">
                    <a href="#overview" class="nav-link">
                        <i class="fas fa-tachometer-alt"></i>
                        <span>Resumen</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="devices.html" class="nav-link">
                        <i class="fas fa-bell"></i>
                        <span>Historial de alertas</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="benchmarks.html" class="nav-link">
                        <i class="fas fa-chart-bar"></i>
                        <span>Benchmarks</span>
                    </a>
                </li>
            </ul>
        </nav>
    </aside>


    <main class="main-content">
        <section class="kpi-section">
            <div class="kpi-grid">
                <div class="kpi-card" id="alarm-control-card"> 
                    <div class="kpi-icon" id="system-status-icon"> 
                        <i class="fas fa-shield-alt"></i>
                    </div>
                    <div class="kpi-info">
                        <h3>Estado del Sistema</h3>
                        <p class="kpi-value" id="system-status-text">Activo</p> 
                    </div>
                </div>
                <div class="kpi-card">
                    <div class="kpi-icon">
                        <i class="fas fa-exclamation-triangle"></i>
                    </div>
                    <div class="kpi-info">
                        <h3>Alertas detectadas hoy</h3>
                        <p id="alerts">--</p>
                    </div>
                </div>
                <div class="kpi-card">
                    <div class="kpi-icon-wrapper" style="background-color: #4a90e2;"> 
                        <i class="fas fa-history"></i>
                    </div>
                    <div class="kpi-content">
                        <small>Última Alerta</small>
                  
                        <div id="recent-event-display">
                            <p class="no-events">No hay alertas recientes.</p>
                        </div>
                    </div>
                </div>
            </div>
        </section>

  
        <section class="charts-section">
            <div class="charts-grid">
                <div class="chart-container">
                    <div class="chart-header">
                        
                    </div>
                    <div class="chart-wrapper">
                        <canvas id="devicesChart"></canvas>
                    </div>
                </div>
            </div>
        </section>

        <section class="data-section">
            <div class="data-container">
                <div class="data-header">
                    <h3>Dispositivos Conectados</h3>
                    <button class="btn-export">
                        <i class="fas fa-download"></i>
                        Exportar
                    </button>
                </div>
                <div class="table-wrapper">
                    <table class="data-table" id="devicesTable">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Dispositivo</th>
                                <th>Estado</th>
                                <th>Última Lectura</th>
                                <th>Tiempo transcurrido</th>
                            </tr>
                        </thead>
                        <tbody id="devicesTableBody">
                        </tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>


    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner">
            <i class="fas fa-spinner fa-spin"></i>
            <p>Cargando datos...</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
