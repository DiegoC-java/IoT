<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard IoT - Iniciar Sesión</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="login.css">
    <style>
        /* Estilos específicos para MFA */
        #mfaGroup {
            display: none !important;
            visibility: hidden !important;
            height: 0 !important;
            overflow: hidden !important;
            transition: all 0.3s ease;
        }

        #mfaGroup.show {
            display: block !important;
            visibility: visible !important;
            height: auto !important;
            overflow: visible !important;
        }

        .mfa-separator {
            text-align: center;
            margin: 20px 0;
            color: #999;
            font-size: 14px;
        }

        .mfa-info {
            background: #e3f2fd;
            border-left: 4px solid #2196F3;
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 15px;
            color: #1976D2;
            font-size: 14px;
        }

        /* Animación de carga */
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
            display: none;
        }

        .loader.show {
            display: block;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .btn-loading {
            position: relative;
            color: transparent !important;
        }

        .btn-loading::after {
            content: '';
            position: absolute;
            width: 16px;
            height: 16px;
            top: 50%;
            left: 50%;
            margin-left: -8px;
            margin-top: -8px;
            border: 2px solid #ffffff;
            border-radius: 50%;
            border-top: 2px solid transparent;
            animation: spin 0.8s linear infinite;
        }

        /* Animación suave para botones */
        button:disabled {
            opacity: 0.7 !important;
            cursor: not-allowed !important;
        }
    </style>
</head>
<body>
    <!-- Partículas de fondo -->
    <div class="particles">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
    </div>

    <div class="login-container">
        <!-- Alert para mensajes -->
        <div id="alert" class="alert">
            <i class="alert-icon"></i>
            <span class="alert-message"></span>
        </div>

        <div class="login-card">
            <div class="login-header">
                <div class="logo">
                    <i class="fas fa-chart-line"></i>
                    <h1>Dashboard IoT</h1>
                </div>
                <p class="subtitle">Accede a tu panel de control</p>
            </div>

            <form class="login-form" id="loginForm">
                <!-- SECCIÓN 1: Credenciales -->
                <div id="credentialsSection">
                    <div class="form-group">
                        <label for="username">Usuario</label>
                        <div class="input-group">
                            <i class="fas fa-user"></i>
                            <input 
                                type="text" 
                                id="username" 
                                name="username" 
                                placeholder="Ingresa tu usuario"
                                required
                                autocomplete="username"
                                maxlength="50"
                            >
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="password">Contraseña</label>
                        <div class="input-group">
                            <i class="fas fa-lock"></i>
                            <input 
                                type="password" 
                                id="password" 
                                name="password" 
                                placeholder="Ingresa tu contraseña"
                                required
                                autocomplete="current-password"
                                maxlength="100"
                            >
                            <button type="button" class="toggle-password" id="togglePassword">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <div class="form-options">
                        <label class="checkbox">
                            <input type="checkbox" id="rememberMe" name="rememberMe">
                            <span>Recordarme</span>
                        </label>
                        <a href="#" class="forgot-password" id="forgotPassword">¿Olvidaste tu contraseña?</a>
                    </div>

                    <button type="submit" class="login-btn" id="loginBtn">
                        <span class="btn-text">Iniciar Sesión</span>
                        <div class="btn-spinner">
                            <i class="fas fa-spinner fa-spin"></i>
                        </div>
                    </button>
                </div>

                <!-- SECCIÓN 2: MFA (Oculto inicialmente) -->
                <div id="mfaSection" style="display: none;">
                    <div class="mfa-info">
                        <i class="fas fa-shield-alt"></i> Se envió un código de verificación a tu correo
                    </div>

                    <div class="form-group">
                        <label for="mfaCode">Código de Autenticación (MFA)</label>
                        <div class="input-group">
                            <i class="fas fa-key"></i>
                            <input 
                                type="text" 
                                id="mfaCode" 
                                name="mfaCode" 
                                placeholder="Ingresa los 6 dígitos"
                                maxlength="6"
                                autocomplete="one-time-code"
                            >
                        </div>
                    </div>

                    <button type="button" class="login-btn" id="verifyMfaBtn">
                        <span class="btn-text">Verificar Código</span>
                        <div class="btn-spinner">
                            <i class="fas fa-spinner fa-spin"></i>
                        </div>
                    </button>

                    <button type="button" class="login-btn" id="backBtn" style="background: #666; margin-top: 10px;">
                        <span class="btn-text">Volver</span>
                    </button>
                </div>

                <div class="form-options">
                    <a href="register.html" class="forgot-password">¿No tienes cuenta? Regístrate</a>
                </div>
            </form>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:3000/api';
        let mfaEmail = null;
        let mfaUsername = null;
        let mfaRememberMe = false;
        let isProcessing = false; // Bandera para evitar múltiples envíos

        // ========== UTILIDADES ==========
        function showAlert(message, type = 'info') {
            const alert = document.getElementById('alert');
            const messageEl = alert.querySelector('.alert-message');
            messageEl.textContent = message;
            alert.className = `alert show alert-${type}`;
        }

        function hideAlert() {
            const alert = document.getElementById('alert');
            alert.className = 'alert';
        }

        function setLoadingState(loading, isVerify = false) {
            const loginBtn = document.getElementById('loginBtn');
            const verifyBtn = document.getElementById('verifyMfaBtn');
            
            if (loading) {
                loginBtn.disabled = true;
                loginBtn.classList.add('btn-loading');
                verifyBtn.disabled = true;
                verifyBtn.classList.add('btn-loading');
                loginBtn.style.opacity = '0.7';
                verifyBtn.style.opacity = '0.7';
            } else {
                loginBtn.disabled = false;
                loginBtn.classList.remove('btn-loading');
                verifyBtn.disabled = false;
                verifyBtn.classList.remove('btn-loading');
                loginBtn.style.opacity = '1';
                verifyBtn.style.opacity = '1';
            }
        }

        // ========== MOSTRAR/OCULTAR SECCIONES ==========
        function showCredentialsSection() {
            document.getElementById('credentialsSection').style.display = 'block';
            document.getElementById('mfaSection').style.display = 'none';
            document.getElementById('mfaCode').value = ''; // Limpiar código anterior
        }

        function showMfaSection(email) {
            document.getElementById('credentialsSection').style.display = 'none';
            document.getElementById('mfaSection').style.display = 'block';
            document.getElementById('mfaCode').value = ''; // Limpiar campo
            document.getElementById('mfaCode').focus();
        }

        // ========== MANEJO DEL LOGIN INICIAL ==========
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            e.stopPropagation(); // Evitar que el evento se propague
            
            // Si ya estamos procesando o estamos en modo MFA, ignorar
            if (isProcessing) {
                console.log('⚠️ Ya hay una petición en proceso, ignorando...');
                return;
            }
            
            // Si estamos en la sección MFA, no hacer nada (el botón de verificar maneja esto)
            if (document.getElementById('mfaSection').style.display === 'block') {
                console.log('⚠️ Estamos en sección MFA, ignorando submit del form');
                return;
            }
            
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const rememberMe = document.getElementById('rememberMe').checked;

            if (!username || !password) {
                showAlert('Por favor, completa todos los campos', 'error');
                return;
            }

            isProcessing = true;
            setLoadingState(true);
            hideAlert();

            try {
                console.log('📝 Intentando login con:', username);
                const response = await fetch(API_URL + '/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();
                console.log('📡 Respuesta del backend:', data);

                if (data.mfaRequired) {
                    console.log('🔐 MFA requerido - Mostrando formulario MFA');
                    mfaEmail = data.email;
                    mfaUsername = username;
                    mfaRememberMe = rememberMe;
                    
                    showAlert(`✅ Código enviado a ${data.email}`, 'success');
                    setLoadingState(false);
                    isProcessing = false;
                    showMfaSection(data.email);
                    return;
                }

                if (data.success) {
                    console.log('✅ Login exitoso');
                    showAlert(`¡Bienvenido, ${username}!`, 'success');
                    localStorage.setItem('iot_user', JSON.stringify({
                        username: data.user.username,
                        role: data.user.role
                    }));
                    localStorage.setItem('iot_login_time', new Date().getTime().toString());
                    
                    // Garantizar redirect después de guardar en localStorage
                    await new Promise(resolve => setTimeout(resolve, 1000));
                    window.location.replace('index.html');
                    return;
                }

                showAlert(data.message || 'Error en la autenticación', 'error');
            } catch (error) {
                console.error('❌ Error:', error);
                showAlert(`Error: ${error.message}`, 'error');
            } finally {
                setLoadingState(false);
                isProcessing = false;
            }
        });

        // ========== MANEJO DE VERIFICACIÓN MFA ==========
        document.getElementById('verifyMfaBtn').addEventListener('click', async (e) => {
            e.preventDefault();
            e.stopPropagation();
            
            if (isProcessing) {
                console.log('⚠️ Ya hay una verificación en proceso, ignorando...');
                return;
            }
            
            const code = document.getElementById('mfaCode').value.trim();

            if (!code || code.length !== 6) {
                showAlert('Ingresa un código válido (6 dígitos)', 'error');
                return;
            }

            isProcessing = true;
            setLoadingState(true, true);
            hideAlert();

            try {
                console.log('🔐 Verificando código MFA...');
                const response = await fetch(API_URL + '/auth/verify-mfa', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        email: mfaEmail, 
                        code: code 
                    })
                });

                const data = await response.json();
                console.log('📡 Respuesta de verificación:', data);

                if (data.success && data.user) {
                    console.log('✅ Código válido - Login completado');
                    showAlert('✅ Login exitoso - Redirigiendo...', 'success');
                    
                    // Guardar sesión
                    localStorage.setItem('iot_user', JSON.stringify({
                        username: data.user.username,
                        role: data.user.role
                    }));
                    localStorage.setItem('iot_login_time', new Date().getTime().toString());
                    
                    // Limpiar variables MFA
                    mfaEmail = null;
                    mfaUsername = null;
                    mfaRememberMe = false;
                    
                    // Deshabilitar botones para evitar doble submit
                    document.getElementById('verifyMfaBtn').disabled = true;
                    document.getElementById('backBtn').disabled = true;
                    
                    // NO liberar isProcessing - queremos bloquear todo hasta redirigir
                    
                    // Redirect después de un momento
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 1500);
                    return;
                }

                // Si llegamos aquí, el código fue incorrecto
                showAlert(data.message || 'Código incorrecto', 'error');
                document.getElementById('mfaCode').value = '';
                document.getElementById('mfaCode').focus();
                setLoadingState(false);
                isProcessing = false;
            } catch (error) {
                console.error('❌ Error:', error);
                showAlert(`Error: ${error.message}`, 'error');
                setLoadingState(false);
                isProcessing = false;
            }
        });

        // ========== BOTÓN VOLVER ==========
        document.getElementById('backBtn').addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();
            
            // Limpiar estado
            document.getElementById('mfaCode').value = '';
            document.getElementById('password').value = ''; // Limpiar contraseña para seguridad
            mfaEmail = null;
            mfaUsername = null;
            mfaRememberMe = false;
            isProcessing = false;
            
            showCredentialsSection();
            hideAlert();
            setLoadingState(false);
        });

        // ========== OTROS EVENTOS ==========
        // Prevenir que Enter en el campo MFA dispare el submit del form principal
        document.getElementById('mfaCode').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                e.stopPropagation();
                // Simular clic en el botón de verificar
                document.getElementById('verifyMfaBtn').click();
            }
        });

        document.getElementById('togglePassword').addEventListener('click', (e) => {
            e.preventDefault();
            const password = document.getElementById('password');
            const icon = e.target.closest('button').querySelector('i');
            
            if (password.type === 'password') {
                password.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                password.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        });

        document.getElementById('forgotPassword').addEventListener('click', (e) => {
            e.preventDefault();
            showAlert('Contacta al administrador para restablecer tu contraseña', 'info');
        });

        console.log('✅ Login cargado correctamente');
    </script>
</body>
</html>
